server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Host port mapping differs from the container port, so directory
    # redirects must stay relative or they point at the internal port.
    absolute_redirect off;

    # The SPA route /assets collides with the static assets/ directory:
    # serve real bundle files, fall back to the app for the route itself.
    # 302 (not cached) so an old cached 301 pointing at the internal port
    # gets replaced on the next visit.
    location = /assets {
        add_header Cache-Control "no-store";
        return 302 /assets/;
    }
    location /assets/ {
        try_files $uri /index.html;
    }

    # index.html must always be revalidated: it names the hashed bundle
    # files, and a heuristic-cached copy keeps serving a stale app after
    # the image has been rebuilt.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = / {
        add_header Cache-Control "no-store";
    }
    location = /prompts {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }
    # Any other SPA route (canvas projects, video studio, …) is also an
    # index.html alias — never let the browser heuristically cache it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
